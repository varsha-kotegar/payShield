# ─────────────────────────────────────────────────────────────────────────────
#  PayShield — Nginx reverse proxy + SSL config
#  Place at: /etc/nginx/sites-available/payshield
#  Enable:   sudo ln -s /etc/nginx/sites-available/payshield /etc/nginx/sites-enabled/
#  Reload:   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=generate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=verify:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m      rate=60r/m;

server {
    listen 80;
    server_name payshield.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name payshield.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/payshield.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payshield.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    location = /sw.js {
        proxy_pass http://127.0.0.1:5000/sw.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        proxy_pass  http://127.0.0.1:5000/static/;
        expires     7d;
        add_header  Cache-Control "public, immutable";
    }

    location /api/generate {
        limit_req  zone=generate burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include    /etc/nginx/snippets/proxy_params;
    }

    location /api/verify {
        limit_req  zone=verify burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include    /etc/nginx/snippets/proxy_params;
    }

    location /api/ {
        limit_req  zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include    /etc/nginx/snippets/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include    /etc/nginx/snippets/proxy_params;
    }

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript;
    client_max_body_size 5M;
}
